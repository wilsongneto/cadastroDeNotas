<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de notas</title>
    <link rel="stylesheet" href="style.css">
     <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <body>

    <div class="container">


        <h1>Calculadora de Notas</h1>


        <p class="explicacao">

            A nota original vale 100 pontos e será convertida para um valor máximo de 60 pontos.

        </p>


        <!-- =====================================
             FORMULÁRIO
        ====================================== -->

        <div class="formulario">


            <div class="campo">

                <label for="nome">

                    Nome do aluno

                </label>


                <input

                    type="text"

                    id="nome"

                    placeholder="Digite o nome"

                >

            </div>


            <div class="campo">

                <label for="nota">

                    Nota (0 a 100)

                </label>


                <input

                    type="number"

                    id="nota"

                    min="0"

                    max="100"

                    step="0.01"

                    placeholder="Ex: 46"

                >

            </div>


            <button

                class="btn-adicionar"

                onclick="adicionarAluno()"

            >

                Adicionar

            </button>


        </div>


        <!-- =====================================
             CONTROLES
        ====================================== -->

        <div class="controles">


            <div class="ordenacao">


                <button

                    class="btn-az"

                    onclick="ordenarAZ()"

                >

                    A → Z

                </button>


                <button

                    class="btn-za"

                    onclick="ordenarZA()"

                >

                    Z → A

                </button>


            </div>


            <button

                class="btn-excel"

                onclick="baixarExcel()"

            >

                📥 Baixar tabela Excel

            </button>


        </div>


        <!-- =====================================
             TABELA
        ====================================== -->

        <table>


            <thead>

                <tr>

                    <th>Aluno</th>

                    <th>Nota Original</th>

                    <th>Nota Convertida (60)</th>

                    <th>Ação</th>

                </tr>

            </thead>


            <tbody id="tabelaAlunos">


                <tr>

                    <td

                        colspan="4"

                        class="vazio"

                    >

                        Nenhum aluno adicionado.

                    </td>

                </tr>


            </tbody>


        </table>


        <!-- =====================================
             RESUMO
        ====================================== -->

        <div class="resumo">


            <div class="card">

                <h3>Alunos</h3>

                <p

                    class="valor"

                    id="quantidade"

                >

                    0

                </p>

            </div>


            <div class="card">

                <h3>Média</h3>

                <p

                    class="valor"

                    id="media"

                >

                    0

                </p>

            </div>


            <div class="card">

                <h3>Maior nota</h3>

                <p

                    class="valor"

                    id="maior"

                >

                    0

                </p>


                <p

                    class="aluno-destaque"

                    id="alunoMaior"

                >

                    -

                </p>

            </div>


            <div class="card">

                <h3>Menor nota</h3>

                <p

                    class="valor"

                    id="menor"

                >

                    0

                </p>


                <p

                    class="aluno-destaque"

                    id="alunoMenor"

                >

                    -

                </p>

            </div>


        </div>


    </div>

<script src="notas.js"></script>
</body>
</html>
